services:
  bot:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cron for hold expiry + conversation TTL close-out.
  # Phase 1: replace the placeholder with the compiled job entrypoint.
  cron:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["node", "dist/jobs/expiry.js"]
    depends_on:
      - bot
